name: Build & Deploy Flutter Web to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch: # Memungkinkan trigger manual dari tab Actions di GitHub

jobs:
  build-and-deploy:
    name: Build Web & Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔨 Build Flutter Web Release
        run: |
          flutter build web --release \
            --base-href "/" \
            --dart-define=API_BASE_URL="${{ secrets.API_BASE_URL }}"

      - name: 🚀 Deploy to VPS via SSH / SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "build/web/*"
          target: ${{ secrets.VPS_TARGET_PATH }}
          strip_components: 2 # Agar isi folder build/web langsung diletakkan di dalam folder target tanpa membuat folder build/web lagi
          rm: false # Set true jika ingin mengosongkan folder target terlebih dahulu sebelum upload

      - name: 🔄 Set Folder Permissions & Reload Nginx (Optional)
        uses: appleboy/ssh-action@v1.0.3
        if: always()
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            sudo chown -R www-data:www-data ${{ secrets.VPS_TARGET_PATH }} || true
            sudo chmod -R 755 ${{ secrets.VPS_TARGET_PATH }} || true
            sudo systemctl reload nginx || true
