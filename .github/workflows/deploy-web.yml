name: Build & Deploy Flutter Web to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Web & Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create .env from secret
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_CONTENT" ]; then
            echo "$ENV_CONTENT" > .env
          else
            cp .env.example .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web release
        run: |
          flutter build web --release \
            --pwa-strategy=none \
            --base-href "/"
          # Tambahkan cache-buster commit hash pada main.dart.js di dalam flutter_bootstrap.js
          # agar browser Laptop & pintasan iOS selalu mengunduh bundle JS terbaru
          BUILD_HASH="${GITHUB_SHA::8}"
          sed -i "s/main\.dart\.js/main.dart.js?v=${BUILD_HASH}/g" build/web/flutter_bootstrap.js || true

      - name: Prepare target folder on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            sudo mkdir -p ${{ secrets.VPS_TARGET_PATH }}
            sudo chown -R ${{ secrets.VPS_USER }}:${{ secrets.VPS_USER }} ${{ secrets.VPS_TARGET_PATH }}
            sudo rm -rf ${{ secrets.VPS_TARGET_PATH }}/*

      - name: Deploy to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "build/web/*"
          target: ${{ secrets.VPS_TARGET_PATH }}
          strip_components: 2
          rm: false

      - name: Set folder permissions and reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        if: always()
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            sudo chmod -R 755 ${{ secrets.VPS_TARGET_PATH }} || true
            sudo systemctl reload nginx || true
